name: Operator memory verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests-and-receipts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Dependencies
        run: python -m pip install -r requirements.txt
      - name: Invariants
        run: python -m unittest discover -s tests -v
      - name: Compile interactive GUI without display
        run: python -m py_compile gui.py
      - name: Reproduce preregistered benchmark
        run: python demo.py --output runs/operator_gate1
      - name: Relational address invariants and held-out worlds
        run: python demo_tem.py --output runs/tem_gate2
      - name: Gate 3 learned relational structure on 20 held-out worlds
        run: python demo_learned.py --output runs/learned_gate3
      - uses: actions/upload-artifact@v4
        with:
          name: aibrainv2-${{ matrix.python-version }}
          path: |
            runs/operator_gate1/
            runs/tem_gate2/
            runs/learned_gate3/
